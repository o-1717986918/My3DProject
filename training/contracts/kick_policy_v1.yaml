schema_version: 1
policy_name: kick_policy_v1
robot: Booster T1
control:
  frequency_hz: 50
  mode: residual_joint_position
  action_size: 23
  action_clip: [-1.0, 1.0]
  units: normalized

joint_order:
  - AAHead_yaw
  - Head_pitch
  - Left_Shoulder_Pitch
  - Left_Shoulder_Roll
  - Left_Elbow_Pitch
  - Left_Elbow_Yaw
  - Right_Shoulder_Pitch
  - Right_Shoulder_Roll
  - Right_Elbow_Pitch
  - Right_Elbow_Yaw
  - Waist
  - Left_Hip_Pitch
  - Left_Hip_Roll
  - Left_Hip_Yaw
  - Left_Knee_Pitch
  - Left_Ankle_Pitch
  - Left_Ankle_Roll
  - Right_Hip_Pitch
  - Right_Hip_Roll
  - Right_Hip_Yaw
  - Right_Knee_Pitch
  - Right_Ankle_Pitch
  - Right_Ankle_Roll

effector_order:
  - he1
  - he2
  - lae1
  - lae2
  - lae3
  - lae4
  - rae1
  - rae2
  - rae3
  - rae4
  - te1
  - lle1
  - lle2
  - lle3
  - lle4
  - lle5
  - lle6
  - rle1
  - rle2
  - rle3
  - rle4
  - rle5
  - rle6

actor_observation:
  size: 90
  frame: torso_yaw_local
  fields:
    - {name: body_angular_velocity, size: 3, units: rad_s}
    - {name: projected_gravity, size: 3, units: normalized}
    - {name: joint_position_offset, size: 23, units: rad}
    - {name: joint_velocity, size: 23, units: rad_s}
    - {name: previous_action, size: 23, units: normalized}
    - {name: ball_position, size: 3, units: m}
    - {name: ball_velocity, size: 3, units: m_s}
    - {name: target_direction, size: 2, units: normalized}
    - {name: ball_observation_age, size: 1, units: s}
    - {name: ball_observation_valid, size: 1, units: binary}
    - {name: phase, size: 2, units: sin_cos}
    - {name: support_hint, size: 3, units: one_hot}

deployment:
  format: ONNX
  input_name: observations
  output_name: actions
  input_shape: [1, 90]
  output_shape: [1, 23]
  requires_finite_output: true
  fallback: existing_stable_kick
