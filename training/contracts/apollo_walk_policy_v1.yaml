schema_version: 1
policy_name: apollo_walk_policy_v1
robot: Booster T1
control:
  frequency_hz: 50
  mode: residual_joint_position
  action_size: 23
  action_clip: [-5.0, 5.0]
  action_scale: 0.25
  gain_profile: apollo_runtime_per_joint
  units: radians

joint_order:
  - AAHead_yaw
  - Head_pitch
  - Left_Shoulder_Pitch
  - Left_Shoulder_Roll
  - Left_Elbow_Pitch
  - Left_Elbow_Yaw
  - Right_Shoulder_Pitch
  - Right_Shoulder_Roll
  - Right_Elbow_Pitch
  - Right_Elbow_Yaw
  - Waist
  - Left_Hip_Pitch
  - Left_Hip_Roll
  - Left_Hip_Yaw
  - Left_Knee_Pitch
  - Left_Ankle_Pitch
  - Left_Ankle_Roll
  - Right_Hip_Pitch
  - Right_Hip_Roll
  - Right_Hip_Yaw
  - Right_Knee_Pitch
  - Right_Ankle_Pitch
  - Right_Ankle_Roll

effector_order:
  - he1
  - he2
  - lae1
  - lae2
  - lae3
  - lae4
  - rae1
  - rae2
  - rae3
  - rae4
  - te1
  - lle1
  - lle2
  - lle3
  - lle4
  - lle5
  - lle6
  - rle1
  - rle2
  - rle3
  - rle4
  - rle5
  - rle6

actor_observation:
  size: 78
  frame: body_local
  fields:
    - {name: body_angular_velocity, size: 3, units: rad_s}
    - {name: projected_gravity, size: 3, units: normalized}
    - {name: velocity_command, size: 3, units: m_s_m_s_rad_s}
    - {name: joint_position_offset, size: 23, units: rad}
    - {name: joint_velocity, size: 23, units: rad_s}
    - {name: previous_action, size: 23, units: normalized}
  clipping: [-10.0, 10.0]
  head_policy_inputs: zeroed_position_velocity_previous_action

decoder:
  nominal_position_rad:
    - 0.0
    - 0.0
    - 0.0
    - -1.4
    - 0.0
    - -0.4
    - 0.0
    - 1.4
    - 0.0
    - 0.4
    - 0.0
    - -0.2
    - 0.0
    - 0.0
    - 0.4
    - -0.2
    - 0.0
    - -0.2
    - 0.0
    - 0.0
    - 0.4
    - -0.2
    - 0.0

source_asset:
  path: runtime/apollo_rebuild/assets/networks/walk/policy.onnx
  sha256: 6df65fa7d36fd4989fcb022e385de797d51f35c8375532841034716e4bc0d850

deployment:
  format: ONNX
  input_name: obs
  output_name: actions
  input_shape: [1, 78]
  output_shape: [1, 23]
  requires_finite_output: true
  fallback: frozen_apollo_walk
