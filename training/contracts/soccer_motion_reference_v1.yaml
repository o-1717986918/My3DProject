schema_version: 1
name: t1_soccer_motion_reference_v1
robot: Booster T1
frequency_hz: 50
format: npz
distribution: external_local_only
arrays:
  root_position: {shape: [T, 3], dtype: float32, units: m}
  root_quaternion_xyzw: {shape: [T, 4], dtype: float32, units: normalized}
  root_linear_velocity: {shape: [T, 3], dtype: float32, units: m_s}
  root_angular_velocity: {shape: [T, 3], dtype: float32, units: rad_s}
  joint_position: {shape: [T, 23], dtype: float32, units: rad}
  joint_velocity: {shape: [T, 23], dtype: float32, units: rad_s}
  foot_contact: {shape: [T, 2], dtype: bool, order: [left, right]}
  kick_leg: {shape: [], dtype: unicode, allowed: [left, right]}
joint_order_contract: run_policy_v3.yaml
k0_gate:
  minimum_frames: 25
  minimum_foot_contact_frames: 2
  minimum_kick_foot_relative_speed_m_s: 0.75
  minimum_kick_to_other_foot_peak_speed_ratio: 1.20
  support_contact_required_within_peak_window_frames: 3
  maximum_joint_velocity_rad_s: 40.0
  maximum_joint_limit_correction_rad: 0.35
  maximum_root_tilt_rad: 1.0
  minimum_root_height_m: 0.30
  maximum_pitch_penetration_m: 0.015
  maximum_non_foot_pitch_contact_frames: 0
  maximum_ground_offset_step_m: 0.05
promotion_semantics:
  k0_pass_means: kinematic_candidate_only
  does_not_prove:
    - dynamic_trackability
    - ball_contact
    - target_accuracy
    - competition_readiness
provenance_required:
  - source_url
  - source_version
  - source_license
  - source_sha256
  - conversion_command
  - retarget_method
license_boundary:
  paid_assets: CC-BY-NC-4.0
  policy: local_attributed_noncommercial_only_never_commit_or_redistribute
